    <text x="678" y="517" font-size="14" fill="#94a3b8">A rotated token must never be accepted twice and all session events are audited...</text>
    <text x="678" y="548" font-size="12" fill="#64748b">vector 0.81  ·  BM25 7.9  ·  reranker 0.89</text>

    <rect x="664" y="584" width="692" height="120" rx="12" fill="#0d1528" stroke="#6b294f"/>
    <rect x="678" y="599" width="42" height="24" rx="12" fill="#500724"/><text x="699" y="616" text-anchor="middle" font-size="12" font-weight="700" fill="#f9a8d4">#3</text>
    <text x="735" y="618" font-weight="700" font-size="15" fill="#e2e8f0">api-sdk.md · POST /auth/refresh</text>
    <text x="1328" y="618" text-anchor="end" font-size="14" font-weight="700" fill="#f9a8d4">0.83</text>
