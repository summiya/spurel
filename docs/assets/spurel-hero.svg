    <rect x="225" width="230" height="52" rx="26" fill="#2e1065" stroke="#a78bfa"/>
    <text x="340" y="34" text-anchor="middle" font-family="Inter,Arial" font-weight="700" font-size="18" fill="#c4b5fd">Compare retrievers</text>
    <rect x="475" width="205" height="52" rx="26" fill="#500724" stroke="#f472b6"/>
    <text x="577.5" y="34" text-anchor="middle" font-family="Inter,Arial" font-weight="700" font-size="18" fill="#f9a8d4">Evaluate RAG</text>
  </g>

  <g transform="translate(1040 185)">
    <circle cx="110" cy="95" r="18" fill="#67e8f9"/>
    <circle cx="20" cy="20" r="12" fill="#8b5cf6"/>
    <circle cx="205" cy="16" r="12" fill="#f472b6"/>
    <circle cx="222" cy="165" r="12" fill="#22c55e"/>
    <circle cx="20" cy="170" r="12" fill="#f59e0b"/>
    <path d="M33 29L96 83M193 28L124 83M127 107L209 156M97 108L31 159" stroke="#64748b" stroke-width="3"/>
