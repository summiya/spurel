<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-label="Spurel open source RAG observability platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#231044"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="32" fill="url(#bg)"/>
  <circle cx="170" cy="88" r="120" fill="#22d3ee" opacity=".12"/>
  <circle cx="1280" cy="470" r="160" fill="#ec4899" opacity=".13"/>
  <circle cx="1110" cy="90" r="105" fill="#8b5cf6" opacity=".12"/>

  <g transform="translate(150 150)">
    <circle cx="42" cy="42" r="36" fill="#0f172a" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="42" cy="42" r="8" fill="#67e8f9" filter="url(#glow)"/>
    <circle cx="8" cy="42" r="5" fill="#8b5cf6"/>
    <circle cx="76" cy="42" r="5" fill="#f472b6"/>
    <circle cx="42" cy="8" r="5" fill="#22d3ee"/>
    <circle cx="42" cy="76" r="5" fill="#a78bfa"/>
    <path d="M13 42h21M50 42h21M42 13v21M42 50v21" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <text x="270" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="98" fill="url(#brand)">SPUREL</text>
  <text x="274" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" font-size="30" fill="#e2e8f0">See what your RAG pipeline is really doing.</text>
  <text x="274" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#94a3b8">Open-source RAG observability · retrieval debugging · evaluation</text>

  <g transform="translate(275 360)">
    <rect width="205" height="52" rx="26" fill="#172554" stroke="#38bdf8"/>
