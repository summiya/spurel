[project]
name = "spurel-backend"
version = "0.1.0"
description = "Backend API for Spurel"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0,<25.0.0",
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "openai>=3.19.0,<4.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pypdf>=6.19.0,<7.0.0",
    "pgvector>=0.4.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.scripts]
spurel-quality-gate = "spurel.evaluation_datasets.quality_gate_cli:main"
spurel-benchmark-gate = "spurel.evaluation_datasets.benchmark_gate_cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.13.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
