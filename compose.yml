services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: spurel
      POSTGRES_USER: spurel
      POSTGRES_PASSWORD: spurel
    ports:
      - "5432:5432"
    volumes:
      - spurel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spurel -d spurel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spurel_postgres_data:
